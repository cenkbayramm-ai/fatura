name: Streamlit Uyandir

on:
  schedule:
    # Pazar hariç her gün (Pzt-Cmt) Türkiye saatiyle 07:45'te (UTC 04:45) çalışır
    - cron: '45 4 * * 1-6'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright Kurulumu
        run: |
          pip install playwright
          playwright install chromium

      - name: Uygulamayı Ziyaret Et ve Uyandır
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("https://fatura-2.streamlit.app/", timeout=60000)
              time.sleep(5)
              button = page.locator('button:has-text("Yes, get this app back up!")')
              if button.count() > 0:
                  print("Uygulama uyuyordu, uyandırma butonuna tıklandı.")
                  button.click()
                  time.sleep(20)
              else:
                  print("Uygulama zaten uyanık.")
              browser.close()
          EOF
